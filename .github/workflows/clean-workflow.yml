name: Cleanup Old Workflow Runs

on:
  workflow_dispatch:
    inputs:
      keep_days:
        description: "Number of recent days to retain (default: 1)"
        required: false
        default: "1"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Delete completed runs older than the specified number of days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_DAYS: ${{ github.event.inputs.keep_days }}
        run: |
          : "${KEEP_DAYS:=1}"
          THRESHOLD="$(date -u -d "${KEEP_DAYS} days ago" '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Threshold time (UTC): $THRESHOLD"

          RUN_IDS=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
                    --paginate -F per_page=100 \
                    --jq '.workflow_runs[]
                          | select(.status=="completed" and .created_at < "'"$THRESHOLD"'")
                          | .id')

          if [ -z "$RUN_IDS" ]; then
            echo "✅ No runs to delete"
            exit 0
          fi

          echo "Number of runs to delete: $(wc -w <<< "$RUN_IDS")"
          for ID in $RUN_IDS; do
            echo "🗑 Deleting run ID: $ID"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${ID}" || {
              echo "⚠️ Failed to delete: $ID (continuing with the remaining items)"
            }
            sleep 0.2
          done

          echo "🎉 Cleanup complete"
